<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamada - Monad</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script>
        if (localStorage.getItem('monad_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; justify-content: center; align-items: center; background-color: var(--bg-slate); transition: background-color 0.5s ease;}
        .painel-aviso { background: var(--surface); padding: 50px; border-radius: var(--radius-lg); box-shadow: var(--shadow-float); text-align: center; border: 4px solid var(--border-strong); width: 80%; max-width: 800px; transform: scale(0.95); opacity: 0.5; transition: all 0.4s ease; }
        
        /* Classe ativada quando o médico clica no botão */
        .chamando { transform: scale(1); opacity: 1; border-color: var(--accent); box-shadow: 0 0 40px var(--accent-ring); }
        .chamando h1 { color: var(--accent) !important; }
        
        h1 { font-size: 45px; margin: 0; color: var(--text-muted); line-height: 1.2; text-transform: uppercase;}
        h2 { font-size: 24px; color: var(--text-secondary); margin-top: 15px; font-weight: 500; }
        .rodape-info { position: absolute; bottom: 20px; font-size: 12px; color: var(--text-muted); font-weight: bold;}
    </style>
</head>
<body>
    <!-- Áudio do "Ding-Dong" (Link público seguro) -->
    <audio id="som-chamada" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b8175b5f.mp3?filename=airport-ding-dong-89025.mp3" preload="auto"></audio>

    <div class="painel-aviso" id="caixa-aviso">
        <h1 id="nome-paciente">AGUARDANDO CHAMADA...</h1>
        <h2 id="sala-paciente">O Médico avisará por aqui.</h2>
    </div>

    <div class="rodape-info">Sistema de Chamada Clínica Monad • Sincronização Ativa 🟢</div>

    <script>
        // COLOQUE O SEU URL DO GOOGLE SCRIPT AQUI
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyf3csqhMdP2uwUa0JXNZ0zdCWji4W3UOngOK26DSWxf0OlNzyMxEwBJdDhuwZN06DXig/exec";
        
        let ultimaChamadaRegistada = 0;
        const nomePaciente = document.getElementById('nome-paciente');
        const salaPaciente = document.getElementById('sala-paciente');
        const caixaAviso = document.getElementById('caixa-aviso');
        const somChamada = document.getElementById('som-chamada');

        // Para permitir o áudio automático no navegador, o utilizador precisa clicar na tela 1 vez.
        document.body.addEventListener('click', () => {
            somChamada.play().then(() => { somChamada.pause(); somChamada.currentTime = 0; }).catch(e => console.log(e));
        }, { once: true });

        function verificarChamada() {
            fetch(`${URL_GOOGLE_SCRIPT}?obterChamada=true`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.timestamp) {
                        // Se o timestamp for MAIOR que o que temos guardado, é uma chamada NOVA!
                        if (data.timestamp > ultimaChamadaRegistada) {
                            ultimaChamadaRegistada = data.timestamp;
                            
                            // Atualiza a tela
                            nomePaciente.textContent = data.nome;
                            salaPaciente.innerHTML = "Dirija-se ao <strong>Consultório Médico</strong>";
                            
                            // Efeito visual e sonoro
                            caixaAviso.classList.add('chamando');
                            somChamada.play().catch(e => console.log("Clique na tela uma vez para ativar o som."));
                            
                            // Remove o destaque visual após 10 segundos
                            setTimeout(() => {
                                caixaAviso.classList.remove('chamando');
                                nomePaciente.textContent = "AGUARDANDO CHAMADA...";
                                salaPaciente.textContent = "O Médico avisará por aqui.";
                            }, 15000);
                        }
                    }
                }).catch(err => console.error(err));
        }

        // Verifica a cada 3 segundos
        setInterval(verificarChamada, 3000);
    </script>
</body>
</html>
