<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Setor - Clínica Monad</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/checkin.css">
    <script>
        if (localStorage.getItem('monad_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        const tokenAtivo = localStorage.getItem('monad_token');
        const setorLogado = localStorage.getItem('monad_setor');
        if (!tokenAtivo || !setorLogado || setorLogado === "todos" || setorLogado === "recepcao") {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <header>
        <h1 style="color: var(--text-strong);">Área Técnica Especializada</h1>
        <h2 id="nome-painel-setor">Carregando Especialidade...</h2>
        <div style="float: right; margin-top: 10px; display: flex; align-items: center; gap: 15px;" class="no-print">
            <!-- NOVO BOTÃO AQUI (Começa invisível) -->
            <button id="btn-relacao-lab" style="display: none; background:var(--accent); color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer; box-shadow: var(--shadow-btn);" onclick="window.location.href='relacao_lab.html'">📋 Relação de Envio</button>
            
            <button id="btn-theme-toggle" class="btn-theme-toggle" title="Alternar Tema">🌙</button>
            <button onclick="localStorage.clear(); window.location.href='login.html'" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Sair</button>
        </div>
    </header>
    </header>
    
    <main>
        <div class="painel-recepcao">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;">
                <h2 style="margin: 0; color: var(--text-strong);">Fila de Atendimento do Setor</h2>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="date" id="filtro-data" style="padding: 8px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface-muted); color: var(--text-strong);">
                        <button id="btn-buscar-data" style="background-color: var(--accent); color: white; border: none; padding: 9px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Buscar</button>
                    </div>
                    <input type="text" id="pesquisa-paciente" placeholder="Buscar colaborador..." style="padding: 8px; width: 220px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface-muted); color: var(--text-strong);">
                </div>
            </div>
            
            <div id="msg-carregando" style="text-align: center; padding: 20px; font-weight: bold; color: var(--accent); display: none;">⏳ Carregando Fila...</div>

            <div class="table-responsive">
                <table class="tabela-liberacao">
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Colaborador</th>
                            <th style="text-align: center;" id="th-dinamico">Procedimentos</th>
                            <th style="text-align: center;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-liberacao"></tbody>
                </table>
            </div>
            
            <div id="msg-vazio" style="text-align: center; padding: 30px; color: var(--text-muted); display: none; background: var(--bg-slate); border-radius: 8px; border: 1px dashed var(--border-strong); margin-top: 10px;">
                <strong>Nenhum paciente pendente para este setor hoje!</strong>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==========================================================
            const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyf3csqhMdP2uwUa0JXNZ0zdCWji4W3UOngOK26DSWxf0OlNzyMxEwBJdDhuwZN06DXig/exec";
            // ==========================================================

            const mapNomes = { "clinico": "Exames Físicos", "raiox": "Radiologia", "fono": "Audiometria", "lab": "Laboratório", "consulta": "Clínico Médico" };
            document.getElementById('nome-painel-setor').textContent = mapNomes[setorLogado] || "Painel Restrito";
            if (setorLogado === 'lab' || setorLogado === 'admin') {
                document.getElementById('btn-relacao-lab').style.display = 'block';
            }
            const tabela = document.getElementById('lista-liberacao');
            const inputData = document.getElementById('filtro-data');
            const msgVazio = document.getElementById('msg-vazio');
            let fetchController = null;

            const hoje = new Date();
            inputData.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;

            function buscar() {
                if(!inputData.value) return;
                
                if(fetchController) fetchController.abort();
                fetchController = new AbortController();
                
                fetch(`${URL_GOOGLE_SCRIPT}?dataExame=${inputData.value}`, { signal: fetchController.signal })
                    .then(r => r.json())
                    .then(data => {
                        if (data.status === "sucesso") renderizar(data.pacientes);
                    }).catch((err) => { if (err.name !== 'AbortError') console.error(err); });
            }

            setInterval(() => {
                if(document.hidden || !inputData.value) return;
                
                if(fetchController) fetchController.abort();
                fetchController = new AbortController();
                
                fetch(`${URL_GOOGLE_SCRIPT}?dataExame=${inputData.value}`, { signal: fetchController.signal })
                    .then(r => r.json())
                    .then(data => {
                        if (data.status === "sucesso") {
                            const filtrados = data.pacientes.filter(p => p[`tem${setorLogado.charAt(0).toUpperCase() + setorLogado.slice(1)}`]);
                            if (filtrados.length !== document.querySelectorAll('.linha-paciente').length) return renderizar(data.pacientes);

                            filtrados.forEach(pac => {
                                const l = document.querySelector(`tr[data-cpf="${pac.cpf}"]`);
                                if (l && l.dataset.syncing !== "true") {
                                    const cb = l.querySelector('.check-setor'); 
                                    const newValue = pac[`liberado${setorLogado.charAt(0).toUpperCase() + setorLogado.slice(1)}`];
                                    if(cb && cb.checked !== newValue && !cb.disabled) cb.checked = newValue;
                                    
                                    const obs = l.querySelector('.obs-input'); 
                                    if(obs && document.activeElement !== obs && obs.value !== (pac.obsLab || '') && !obs.disabled) obs.value = pac.obsLab || '';
                                    
                                    verificarFila(l);
                                }
                            });
                        }
                    }).catch((err) => { if (err.name !== 'AbortError') console.error(err); });
            }, 15000);

            function renderizar(pacientes) {
                tabela.innerHTML = ""; let visiveis = 0;
                pacientes.forEach(pac => {
                    const mapa = {
                        clinico: { tem: pac.temClinico, txt: pac.examesClinicos, lib: pac.liberadoClinico },
                        raiox: { tem: pac.temRaiox, txt: pac.examesRaioX, lib: pac.liberadoRaiox },
                        fono: { tem: pac.temFono, txt: "Audiometria", lib: pac.liberadoFono },
                        lab: { tem: pac.temLab, txt: pac.examesLab, lib: pac.liberadoLab },
                        consulta: { tem: pac.temConsulta, txt: "Consulta Médica", lib: pac.liberadoConsulta }
                    };

                    const atual = mapa[setorLogado];
                    if(!atual || !atual.tem) return;
                    visiveis++;

                    let exames = `
                        <div class="celula-exame">
                            <input type="checkbox" class="check-setor" ${atual.lib ? 'checked' : ''}>
                            <div class="detalhe-exame">${atual.txt}</div>
                        </div>`;
                        
                    if (setorLogado === "lab") exames += `<textarea class="obs-input" data-cpf="${pac.cpf}" placeholder="Observação da coleta..." rows="2"></textarea>`;

                    const tipoStr = pac.tipoExame ? (pac.tipoExame.includes('(') ? pac.tipoExame : `(${pac.tipoExame})`) : '';

                    const tr = document.createElement('tr');
                    tr.className = 'linha-paciente'; tr.dataset.cpf = pac.cpf; tr.dataset.syncing = "false";
                    tr.innerHTML = `
                        <td><span class="tag-empresa">${pac.empresa || '-'} <span style="font-size:10px; color:var(--accent);">${tipoStr}</span></span></td>
                        <td>
                            <div class="perfil-paciente">
                                <div class="avatar">${pac.nome.charAt(0).toUpperCase()}</div>
                                <span class="col-nome">${pac.nome}</span>
                            </div>
                        </td>
                        <td>${exames}</td>
                        <td style="text-align: center;"><span class="badge-status pendente">AGUARDANDO</span></td>
                    `;
                    tabela.appendChild(tr); verificarFila(tr);
                });
                msgVazio.style.display = visiveis === 0 ? 'block' : 'none';
            }

            tabela.addEventListener('change', function(e) {
                const tr = e.target.closest('tr');
                tr.dataset.syncing = "true";

                if (e.target.classList.contains('check-setor')) {
                    const cb = e.target;
                    cb.disabled = true; 
                    cb.style.opacity = "0.4";
                    
                    fetch(URL_GOOGLE_SCRIPT, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ token: localStorage.getItem('monad_token'), acao: "ATUALIZAR_SETOR", cpf: tr.dataset.cpf, setor: setorLogado, liberado: cb.checked })
                    }).then(r => r.json()).then(res => {
                        if(res.status !== "sucesso") throw new Error();
                        cb.style.opacity = "1";
                        cb.disabled = false; 
                        verificarFila(tr);
                        setTimeout(() => tr.dataset.syncing = "false", 1500);
                    }).catch(() => { 
                        cb.checked = !cb.checked; 
                        cb.style.opacity = "1"; 
                        cb.disabled = false;
                        tr.dataset.syncing = "false"; 
                    });
                }

                if (e.target.classList.contains('obs-input')) {
                    const obsInput = e.target;
                    obsInput.disabled = true; 
                    obsInput.style.opacity = "0.6";
                    
                    fetch(URL_GOOGLE_SCRIPT, {
                        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ token: localStorage.getItem('monad_token'), acao: "ATUALIZAR_OBS", cpf: tr.dataset.cpf, obs: obsInput.value })
                    }).then(r => r.json()).then(res => {
                        if(res.status !== "sucesso") throw new Error();
                        obsInput.style.opacity = "1"; 
                        obsInput.style.borderColor = "var(--success)";
                        obsInput.disabled = false;
                        setTimeout(() => obsInput.style.borderColor = "var(--border-strong)", 2000);
                        setTimeout(() => tr.dataset.syncing = "false", 1500);
                    }).catch(() => { 
                        obsInput.style.opacity = "1"; 
                        obsInput.style.borderColor = "var(--danger)"; 
                        obsInput.disabled = false;
                        tr.dataset.syncing = "false"; 
                    });
                }
            });

            function verificarFila(l) {
                const cb = l.querySelector('.check-setor'); const b = l.querySelector('.badge-status');
                if(cb && cb.checked) { b.textContent = 'CONCLUÍDO'; b.className = 'badge-status liberado'; l.style.opacity="0.5"; }
                else { b.textContent = 'AGUARDANDO'; b.className = 'badge-status pendente'; l.style.opacity="1"; }
            }

            document.getElementById('btn-buscar-data').addEventListener('click', buscar);
            document.getElementById('pesquisa-paciente').addEventListener('input', (e) => {
                const termo = e.target.value.toLowerCase();
                document.querySelectorAll('.linha-paciente').forEach(l => l.style.display = l.textContent.toLowerCase().includes(termo) ? '' : 'none');
            });
            buscar();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnTheme = document.getElementById('btn-theme-toggle');
            if (btnTheme) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btnTheme.textContent = isDark ? '☀️' : '🌙';
                btnTheme.addEventListener('click', () => {
                    if (document.documentElement.getAttribute('data-theme') === 'dark') {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('monad_theme', 'light');
                        btnTheme.textContent = '🌙';
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('monad_theme', 'dark');
                        btnTheme.textContent = '☀️';
                    }
                });
            }
        });
    </script>
</body>
</html>
