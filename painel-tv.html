<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamadas - TV</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #0f172a; color: white; overflow: hidden; display: flex; height: 100vh; }
        
        /* TELA DE BLOQUEIO INICIAL (Navegadores exigem 1 clique para permitir som) */
        #tela-bloqueio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        #btn-iniciar-tv { background: #3b82f6; color: white; border: none; padding: 20px 40px; font-size: 24px; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5); }
        
        /* LAYOUT PRINCIPAL */
        .area-destaque { flex: 2.5; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; border-right: 2px solid #1e293b; position: relative; }
        .area-historico { flex: 1; background-color: #1e293b; display: flex; flex-direction: column; }
        
        /* DESTAQUE DO PACIENTE */
        .alerta-pisca { animation: piscar 1s infinite alternate; }
        @keyframes piscar { from { opacity: 1; text-shadow: 0 0 20px #3b82f6; } to { opacity: 0.7; text-shadow: 0 0 50px #60a5fa; } }
        
        .lbl-chamando { font-size: 30px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 20px; }
        .nome-destaque { font-size: 7vw; font-weight: 900; line-height: 1.1; margin: 0; color: #ffffff; }
        .empresa-destaque { font-size: 2vw; color: #cbd5e1; margin-top: 15px; background: #334155; padding: 5px 20px; border-radius: 50px; display: inline-block; }
        .setor-box { margin-top: 60px; background: #2563eb; padding: 20px 50px; border-radius: 20px; box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4); }
        .lbl-setor { font-size: 24px; color: #bfdbfe; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .nome-setor { font-size: 4vw; font-weight: bold; margin: 0; }

        /* HISTÓRICO LATERAL */
        .historico-header { background: #0f172a; padding: 25px; font-size: 22px; font-weight: bold; text-align: center; color: #94a3b8; letter-spacing: 2px; border-bottom: 1px solid #334155; }
        .lista-historico { flex: 1; padding: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 15px; }
        .card-historico { background: #334155; padding: 20px; border-radius: 12px; border-left: 6px solid #64748b; opacity: 0.8; }
        .hist-nome { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .hist-setor { font-size: 16px; color: #94a3b8; }
        
        /* LOGO INFERIOR */
        .logo-monad { position: absolute; bottom: 30px; font-size: 20px; color: #475569; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="tela-bloqueio">
        <h1 style="margin-bottom: 30px; font-size: 40px;">Painel de Recepção</h1>
        <button id="btn-iniciar-tv">INICIAR MODO TV COM ÁUDIO</button>
    </div>

    <div class="area-destaque">
        <div class="lbl-chamando alerta-pisca" id="lbl-status" style="visibility: hidden;">Comparecer ao Setor</div>
        <h1 class="nome-destaque" id="tv-nome">AGUARDE...</h1>
        <div class="empresa-destaque" id="tv-empresa" style="visibility: hidden;"></div>
        
        <div class="setor-box" id="box-setor" style="visibility: hidden;">
            <div class="lbl-setor">Dirija-se à</div>
            <h2 class="nome-setor" id="tv-setor"></h2>
        </div>

        <div class="logo-monad">CLÍNICA MONAD OCUPACIONAL</div>
    </div>

    <div class="area-historico">
        <div class="historico-header">ÚLTIMAS CHAMADAS</div>
        <div class="lista-historico" id="container-historico">
            </div>
    </div>

    <script>
        // SUA URL DO GOOGLE APPS SCRIPT
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyf3csqhMdP2uwUa0JXNZ0zdCWji4W3UOngOK26DSWxf0OlNzyMxEwBJdDhuwZN06DXig/exec"; 
        
        let chamadosProcessados = new Set(); // Evita chamar a mesma pessoa 2x sem o técnico pedir
        let tocandoAgora = false;

        // Iniciar Som e liberar tela
        document.getElementById('btn-iniciar-tv').addEventListener('click', function() {
            document.getElementById('tela-bloqueio').style.display = 'none';
            // Toca um áudio mudo só para desbloquear a engine de voz do navegador
            const synth = window.speechSynthesis;
            const ut = new SpeechSynthesisUtterance("");
            synth.speak(ut);
            
            // Inicia o Radar da TV (A cada 3 segundos)
            setInterval(buscarChamados, 1000);
            buscarChamados();
        });

        // Efeito Sonoro Ding-Dong
        function tocarDingDong() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
            const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
            
            osc1.connect(gain1); gain1.connect(ctx.destination);
            osc2.connect(gain2); gain2.connect(ctx.destination);
            
            osc1.type = 'sine'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(659.25, ctx.currentTime); // Nota Mi
            osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.6); // Nota Dó
            
            gain1.gain.setValueAtTime(0, ctx.currentTime);
            gain1.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.1);
            gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            
            gain2.gain.setValueAtTime(0, ctx.currentTime + 0.6);
            gain2.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.7);
            gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
            
            osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.6);
            osc2.start(ctx.currentTime + 0.6); osc2.stop(ctx.currentTime + 1.5);
        }

        // Falar texto com IA Nativa
        function falarTexto(nome, setor) {
            const frase = `Atenção. Paciente: ${nome}. Por favor, comparecer à ${setor}.`;
            const utterance = new SpeechSynthesisUtterance(frase);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.50; 
            
            utterance.onend = function() {
                tocandoAgora = false;
            };
            
            window.speechSynthesis.speak(utterance);
        }

        function buscarChamados() {
            if (tocandoAgora) return; 

            fetch(URL_GOOGLE_SCRIPT) 
                .then(r => r.json())
                .then(data => {
                    if (data.status === "sucesso" && data.chamados) {
                        
                        let lista = data.chamados.sort((a, b) => Number(a.hora) - Number(b.hora));
                        let pacientePraTocar = lista.find(c => c.status === "TOCAR");
                        
                        if (pacientePraTocar && !chamadosProcessados.has(pacientePraTocar.hora)) {
                            executarChamada(pacientePraTocar);
                        }
                        
                        let concluidos = lista.filter(c => c.status === "MOSTRADO").reverse().slice(0, 5);
                        atualizarHistorico(concluidos);
                    }
                }).catch(e => console.log("TV Aguardando rede..."));
        }

        function executarChamada(pac) {
            tocandoAgora = true;
            chamadosProcessados.add(pac.hora); 

            // Mostra na tela
            document.getElementById('lbl-status').style.visibility = 'visible';
            document.getElementById('tv-empresa').style.visibility = 'visible';
            document.getElementById('box-setor').style.visibility = 'visible';
            
            document.getElementById('tv-nome').textContent = pac.nome;
            document.getElementById('tv-empresa').textContent = pac.empresa;
            document.getElementById('tv-setor').textContent = pac.setor;

            tocarDingDong();
            setTimeout(() => falarTexto(pac.nome, pac.setor), 1500);

            // Avisa o Google que já tocou para dar baixa
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "CHAMADO_CONCLUIDO", cpf: pac.cpf })
            });
        }

        function atualizarHistorico(concluidos) {
            const box = document.getElementById('container-historico');
            box.innerHTML = '';
            concluidos.forEach(c => {
                box.innerHTML += `
                    <div class="card-historico">
                        <div class="hist-nome">${c.nome}</div>
                        <div class="hist-setor">Setor: ${c.setor}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
