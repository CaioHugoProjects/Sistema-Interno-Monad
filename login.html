<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Interno - Clínica Monad</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script>
        // GATEKEEPER E LEITURA DO MODO ESCURO
        if (localStorage.getItem('monad_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        .login-container { max-width: 400px; margin: 80px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 4px solid #004080; }
        .form-login { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .form-login label { font-weight: bold; color: #475569; font-size: 14px; }
        .form-login input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 16px; background-color: #f8fafc; }
        .form-login input:focus { border-color: #2563eb; outline: none; background-color: white; }
        .btn-login { background-color: #004080; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-login:hover { background-color: #002d62; }
        .btn-login:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .msg-erro { color: #dc2626; font-weight: bold; font-size: 14px; text-align: center; display: none; background: #fee2e2; padding: 8px; border-radius: 4px; border: 1px solid #fca5a5; }

        /* REGRAS DO DARK MODE APENAS PARA O LOGIN */
        [data-theme="dark"] body { background-color: #0f172a; }
        [data-theme="dark"] .login-container { background: #1e293b; border-color: #334155; box-shadow: none; border-top: 4px solid #3b82f6;}
        [data-theme="dark"] .login-container h3 { color: #60a5fa !important; }
        [data-theme="dark"] .form-login label { color: #cbd5e1; }
        [data-theme="dark"] .form-login input { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
        [data-theme="dark"] .btn-login { background-color: #2563eb; }
        [data-theme="dark"] .btn-login:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Gestão Interna</h1>
        <h2>Clínica Monad Ocupacional - Oriximiná</h2>
        <div style="float: right; margin-top: 10px; display: flex; align-items: center; gap: 15px;" class="no-print">
            <button id="btn-theme-toggle" class="btn-theme-toggle" title="Alternar Tema">🌙</button>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h3 style="margin:0; text-align:center; color:#004080; font-size:20px;">Autenticação de Setor</h3>
            <div class="msg-erro" id="erro-box"></div>
            
            <form id="loginForm" class="form-login">
                <label>Usuário do Setor:
                    <input type="text" id="username" required autocomplete="username" placeholder="Ex: raiox, lab, fono...">
                </label>
                
                <label>Senha de Acesso:
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </label>
                
                <button type="submit" class="btn-login" id="submitBtn">Entrar no Painel</button>
            </form>
        </div>
    </main>

    <!-- INÍCIO DA ADAPTAÇÃO PARA SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const erroBox = document.getElementById('erro-box');
            
            // Pega os dados digitados (passando o usuário para minúsculo para evitar erros)
            const user = document.getElementById('username').value.trim().toLowerCase();
            const senha = document.getElementById('password').value.trim();
            
            erroBox.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Autenticando...";
            
            try {
                // ==========================================================
                // CONSULTA DIRETA AO BANCO SUPABASE
                // ==========================================================
                const { data, error } = await supabase
                    .from('usuarios')
                    .select('setor')
                    .eq('usuario', user)
                    .eq('senha', senha)
                    .single(); // O .single() garante que se a senha estiver errada, caia no catch

                if (error || !data) {
                    throw new Error("Usuário ou senha incorretos.");
                }

                // ==========================================================
                // SUCESSO: SALVA OS DADOS E REDIRECIONA
                // ==========================================================
                localStorage.setItem('monad_token', 'autenticado_supabase'); // Token simbólico
                localStorage.setItem('monad_setor', data.setor);
                
                // Mantida a sua lógica original de redirecionamento por setor
                if (data.setor === "recepcao") {
                    window.location.href = "index.html";
                } else if (data.setor === "todos") {
                    window.location.href = "checkin.html";
                } else if (data.setor === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "setor.html";
                }

            } catch (err) {
                // Tratamento de erro (senha errada ou sem internet)
                erroBox.textContent = err.message === "JSON object requested, multiple (or no) rows returned" 
                                      ? "Usuário ou senha incorretos." 
                                      : err.message || "Erro ao conectar com o servidor.";
                erroBox.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Entrar no Painel";
            }
        });
    </script>
    <!-- FIM DA ADAPTAÇÃO -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnTheme = document.getElementById('btn-theme-toggle');
            if (btnTheme) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btnTheme.textContent = isDark ? '☀️' : '🌙';
                btnTheme.addEventListener('click', () => {
                    if (document.documentElement.getAttribute('data-theme') === 'dark') {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('monad_theme', 'light');
                        btnTheme.textContent = '🌙';
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('monad_theme', 'dark');
                        btnTheme.textContent = '☀️';
                    }
                });
            }
        });
    </script>
</body>
</html>
