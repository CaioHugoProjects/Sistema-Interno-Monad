<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Geral - Clínica Monad</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/checkin.css">
    <script>
        // GATEKEEPER E LEITURA DO MODO ESCURO
        if (localStorage.getItem('monad_theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        const tokenAtivo = localStorage.getItem('monad_token');
        const setorLogado = localStorage.getItem('monad_setor');
        if (!tokenAtivo || !setorLogado || (setorLogado !== "todos" && setorLogado !== "recepcao" && setorLogado !== "admin")) {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <header>
        <h1 style="color: var(--text-strong);">Sistema Interno</h1>
        <h2>Painel de Gestão (Visão Geral)</h2>
        <div style="float: right; margin-top: 10px; display: flex; align-items: center; gap: 15px;" class="no-print">
            <button id="btn-theme-toggle" class="btn-theme-toggle" title="Alternar Tema">🌙</button>
            <button onclick="localStorage.clear(); window.location.href='login.html'" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Sair</button>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Recepção</a></li>
                <li><a href="checkin.html" style="background-color: #003366;">Visão Geral</a></li>
                <li><a href="reimpressao.html">Reimpressão / Agendados</a></li>
                <li id="menu-admin" style="display: none;"><a href="admin.html" style="background-color: #7f1d1d;">Painel Admin</a></li>
            </ul>
        </nav>
        <script>
            if (localStorage.getItem('monad_setor') === 'admin') {
                document.getElementById('menu-admin').style.display = 'block';
            }
        </script>
    </header>
    
    <main>
        <div class="painel-recepcao">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px;">
                <h2 style="margin: 0; color: var(--text-strong);">Acompanhamento Global</h2>
                
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="date" id="filtro-data" style="padding: 8px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface-muted); color: var(--text-strong);">
                        <button id="btn-buscar-data" style="background-color: var(--accent); color: white; border: none; padding: 9px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Atualizar</button>
                    </div>
                    <input type="text" id="pesquisa-paciente" placeholder="Pesquisar..." style="padding: 8px; width: 220px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface-muted); color: var(--text-strong);">
                </div>
            </div>

            <div class="tabs-setores">
                <button class="tab-btn active" data-aba="todos">Todos os Setores</button>
                <button class="tab-btn" data-aba="clinico">Clínico</button>
                <button class="tab-btn" data-aba="raiox">Raio-X</button>
                <button class="tab-btn" data-aba="fono">Fonoaudiologia</button>
                <button class="tab-btn" data-aba="lab">Laboratório</button>
                <button class="tab-btn" data-aba="consulta">Consulta Médica</button>
            </div>
            
            <div id="msg-carregando" style="text-align: center; padding: 20px; font-weight: bold; color: var(--accent); display: none;">⏳ A procurar dados...</div>

            <div class="table-responsive">
                <table class="tabela-liberacao">
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Colaborador</th>
                            <th class="col-clinico" style="text-align: center;">Clínico</th>
                            <th class="col-raiox" style="text-align: center;">Raio-X</th>
                            <th class="col-fono" style="text-align: center;">Fono</th>
                            <th class="col-lab" style="text-align: center;">Laboratório</th>
                            <th class="col-consulta" style="text-align: center;">Consulta</th>
                            <th style="text-align: center;">Status Global</th>
                        </tr>
                    </thead>
                    <tbody id="lista-liberacao"></tbody>
                </table>
            </div>
            
            <div id="msg-vazio" style="text-align: center; padding: 30px; color: var(--text-muted); display: none; background: var(--bg-slate); border-radius: 8px; border: 1px dashed var(--border-strong); margin-top: 10px;">
                <strong>Nenhum paciente encontrado.</strong>
            </div>
        </div>
    </main>

    <!-- INÍCIO DA ADAPTAÇÃO PARA SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabela = document.getElementById('lista-liberacao');
            const inputData = document.getElementById('filtro-data');
            const inputPesq = document.getElementById('pesquisa-paciente');
            let abaAtiva = 'todos'; 

            const hoje = new Date();
            inputData.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    abaAtiva = this.getAttribute('data-aba');
                    aplicarFiltros();
                });
            });

            async function buscarDados() {
                if(!inputData.value) return;
                document.getElementById('msg-carregando').style.display = "block";
                
                try {
                    const { data, error } = await supabase
                        .from('atendimentos')
                        .select('*')
                        .eq('data_exame', inputData.value)
                        .order('created_at', { ascending: false });

                    document.getElementById('msg-carregando').style.display = "none";
                    if (error) throw error;

                    if (data && data.length > 0) {
                        renderizarTabela(data);
                    } else { 
                        tabela.innerHTML = ""; 
                        document.getElementById('msg-vazio').style.display = "block"; 
                    }
                } catch (err) {
                    console.error("Erro na busca:", err);
                    document.getElementById('msg-carregando').style.display = "none";
                }
            }

            setInterval(atualizacaoSilenciosa, 15000);

            async function atualizacaoSilenciosa() {
                if (document.hidden || !inputData.value) return; 
                
                try {
                    const { data, error } = await supabase
                        .from('atendimentos')
                        .select('*')
                        .eq('data_exame', inputData.value);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        const pacValidos = data.filter(p => 
                            (p.exames_clinicos && p.exames_clinicos !== 'Nenhum') || 
                            (p.exames_raiox && p.exames_raiox !== 'Nenhum') || 
                            (p.exames_lab && p.exames_lab !== 'Nenhum') || 
                            p.audiometria === true || p.consulta_clinica === true
                        );
                        
                        // Se entrou gente nova, recarrega a tabela inteira
                        if (pacValidos.length !== document.querySelectorAll('.linha-paciente').length) {
                            renderizarTabela(data);
                            return;
                        }
                        
                        // Se não, só atualiza os checkboxes invisivelmente
                        data.forEach(pac => {
                            const linha = document.querySelector(`tr[data-cpf="${pac.cpf}"]`);
                            if (linha) {
                                const updateCheck = (cls, val) => {
                                    const cb = linha.querySelector(cls);
                                    if (cb && cb.checked !== val) cb.checked = val;
                                };
                                
                                updateCheck('.c-clinico', pac.liberado_clinico);
                                updateCheck('.c-raiox', pac.liberado_raiox);
                                updateCheck('.c-fono', pac.liberado_fono);
                                updateCheck('.c-lab', pac.liberado_lab);
                                updateCheck('.c-consulta', pac.liberado_consulta);
                                
                                const obs = linha.querySelector('.obs-read'); 
                                if(obs && obs.textContent !== (pac.observacao || '')) obs.textContent = pac.observacao;
                                
                                verificarStatusFilaLocal(linha);
                            }
                        });
                    }
                } catch (err) { console.error("Erro no polling:", err); }
            }

            function renderizarTabela(pacientes) {
                tabela.innerHTML = "";
                pacientes.forEach(pac => {
                    const temClinico = pac.exames_clinicos && pac.exames_clinicos !== 'Nenhum';
                    const temRaiox = pac.exames_raiox && pac.exames_raiox !== 'Nenhum';
                    const temLab = pac.exames_lab && pac.exames_lab !== 'Nenhum';
                    const temFono = pac.audiometria === true;
                    const temConsulta = pac.consulta_clinica === true;

                    if (!temClinico && !temRaiox && !temLab && !temFono && !temConsulta) return;

                    const cell = (exame, checked, classe) => `
                        <div class="celula-exame">
                            <input type="checkbox" class="${classe}" ${checked ? 'checked' : ''} onclick="return false;" style="cursor:not-allowed; transform: scale(1.2);">
                            <div class="detalhe-exame" style="margin-top:5px;">${exame}</div>
                        </div>
                    `;
                    const cellLab = (exame, checked, obs) => `
                        <div class="celula-exame">
                            <input type="checkbox" class="c-lab" ${checked ? 'checked' : ''} onclick="return false;" style="cursor:not-allowed; transform: scale(1.2);">
                            <div class="detalhe-exame" style="margin-top:5px;">${exame}</div>
                            <div class="obs-read" style="font-size:10px; color:var(--danger); background:var(--danger-soft); padding:3px; border-radius:3px; width:100%; text-align:center; min-height: 18px; margin-top:5px;">${obs || ''}</div>
                        </div>
                    `;

                    const tdC = temClinico ? cell(pac.exames_clinicos, pac.liberado_clinico, 'c-clinico') : `<span class="text-na">—</span>`;
                    const tdR = temRaiox ? cell(pac.exames_raiox, pac.liberado_raiox, 'c-raiox') : `<span class="text-na">—</span>`;
                    const tdF = temFono ? cell("Audiometria", pac.liberado_fono, 'c-fono') : `<span class="text-na">—</span>`;
                    const tdL = temLab ? cellLab(pac.exames_lab, pac.liberado_lab, pac.observacao) : `<span class="text-na">—</span>`;
                    const tdM = temConsulta ? cell("Médico do Trabalho", pac.liberado_consulta, 'c-consulta') : `<span class="text-na">—</span>`;

                    const iniciais = (pac.nome || '-').split(" ").map((n, i, a) => i === 0 || i === a.length - 1 ? n[0] : "").join("").toUpperCase();

                    const tr = document.createElement('tr');
                    tr.className = 'linha-paciente';
                    tr.dataset.cpf = pac.cpf;
                    tr.dataset.clinico = temClinico;
                    tr.dataset.raiox = temRaiox;
                    tr.dataset.fono = temFono;
                    tr.dataset.lab = temLab;
                    tr.dataset.consulta = temConsulta;

                    tr.innerHTML = `
                        <td><span class="tag-empresa">${pac.empresa || '-'}</span></td>
                        <td><div class="perfil-paciente"><div class="avatar">${iniciais}</div><span class="col-nome">${pac.nome}</span></div></td>
                        <td class="col-clinico" style="text-align: center;">${tdC}</td>
                        <td class="col-raiox" style="text-align: center;">${tdR}</td>
                        <td class="col-fono" style="text-align: center;">${tdF}</td>
                        <td class="col-lab" style="text-align: center;">${tdL}</td>
                        <td class="col-consulta" style="text-align: center;">${tdM}</td>
                        <td style="text-align: center;"><span class="badge-status pendente">AGUARDANDO</span></td>
                    `;
                    tabela.appendChild(tr);
                    verificarStatusFilaLocal(tr);
                });
                aplicarFiltros();
            }

            function aplicarFiltros() {
                const termo = inputPesq.value.toLowerCase();
                let visiveis = 0;
                ['clinico', 'raiox', 'fono', 'lab', 'consulta'].forEach(s => {
                    document.querySelectorAll(`.col-${s}`).forEach(el => el.style.display = (abaAtiva === 'todos' || abaAtiva === s) ? '' : 'none');
                });
                document.querySelectorAll('.linha-paciente').forEach(linha => {
                    const passaPesq = linha.textContent.toLowerCase().includes(termo);
                    const passaAba = abaAtiva === 'todos' || linha.dataset[abaAtiva] === 'true';
                    linha.style.display = (passaPesq && passaAba) ? '' : 'none';
                    if (passaPesq && passaAba) visiveis++;
                });
                document.getElementById('msg-vazio').style.display = visiveis === 0 ? 'block' : 'none';
            }

            function verificarStatusFilaLocal(linha) {
                const checkboxes = linha.querySelectorAll('input[type="checkbox"]');
                const marcados = linha.querySelectorAll('input[type="checkbox"]:checked');
                const badge = linha.querySelector('.badge-status');
                if (checkboxes.length > 0 && checkboxes.length === marcados.length) {
                    badge.textContent = 'CONCLUÍDO'; badge.className = 'badge-status liberado'; linha.classList.add('paciente-liberado-fade');
                } else {
                    badge.textContent = 'EM ATENDIMENTO'; badge.className = 'badge-status pendente'; linha.classList.remove('paciente-liberado-fade');
                }
            }

            document.getElementById('btn-buscar-data').addEventListener('click', buscarDados);
            inputPesq.addEventListener('input', aplicarFiltros);
            buscarDados();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnTheme = document.getElementById('btn-theme-toggle');
            if (btnTheme) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btnTheme.textContent = isDark ? '☀️' : '🌙';
                btnTheme.addEventListener('click', () => {
                    if (document.documentElement.getAttribute('data-theme') === 'dark') {
                        document.documentElement.removeAttribute('data-theme');
                        localStorage.setItem('monad_theme', 'light');
                        btnTheme.textContent = '🌙';
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('monad_theme', 'dark');
                        btnTheme.textContent = '☀️';
                    }
                });
            }
        });
    </script>
</body>
</html>
